name: ci-application

on:
  push:
    branches:
      - main
      - issue-19

defaults:
  run:
    working-directory: ./app  # Ensure this is the correct directory or remove it if unnecessary

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Cache node modules
        uses: actions/cache@v3
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-v5-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}

      - uses: actions/setup-node@v1
        with:
          node-version: '16.x'

      - name: List directory contents (for debugging)
        run: ls -la  # This will show the file structure, so you can verify where your app is

      - run: npm ci --legacy-peer-deps

      - run: curl https://install.meteor.com/ | sh

      - name: Run Meteor commands
        shell: bash -l {0}
        run: |
          meteor npm install
          meteor npm run lint
          meteor npm run testcafe-ci
